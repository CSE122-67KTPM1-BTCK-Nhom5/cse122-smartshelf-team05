<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm kiếm sản phẩm - SmartShelf</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-icon">◆</span> SmartShelf</a>
      <nav class="nav flex-column mt-4">
        <a class="nav-link active" href="shopper-product-search.html">⌕ <span>Tìm kiếm sản phẩm</span></a><a
          class="nav-link" href="shopper-product-location.html">♧ <span>Vị trí sản phẩm</span></a><a class="nav-link"
          href="shopper-product-alternatives.html">✦ <span>Sản phẩm thay thế</span></a><a class="nav-link"
          href="cart-checkout.html">🛒 <span>Giỏ hàng <b id="cart-count" class="cart-badge">0</b></span></a>
      </nav>
      <div class="profile">
        <div class="avatar">NV</div>
        <div><strong>Nguyễn Văn Hân</strong><small>Khách hàng</small></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div><span class="eyebrow">DANH MỤC SẢN PHẨM</span>
          <h1>Tìm kiếm và lọc sản phẩm</h1>
          <p class="text-secondary">Tìm mặt hàng bạn cần trong cửa hàng.</p>
        </div><a class="btn btn-outline-primary" href="cart-checkout.html">🛒 Giỏ hàng (<span
            id="header-cart-count">0</span>)</a>
      </div>
      <div class="filter-panel row g-3 align-items-end">
        <div class="col-lg-4"><label for="search-input" class="form-label">Tên sản phẩm</label><input id="search-input"
            class="form-control" placeholder="Ví dụ: Sữa tươi"></div>
        <div class="col-6 col-lg-2"><label for="category-filter" class="form-label">Danh mục</label><select
            id="category-filter" class="form-select">
            <option value="">Tất cả</option>
            <option value="Sữa">Sữa</option>
            <option value="Thực phẩm">Thực phẩm</option>
            <option value="Trứng">Trứng</option>
          </select></div>
        <div class="col-6 col-lg-2"><label for="brand-filter" class="form-label">Hãng</label><select id="brand-filter"
            class="form-select">
            <option value="">Tất cả</option>
            <option>Vinamilk</option>
            <option>TH True Milk</option>
            <option>Meadow Fresh</option>
            <option>Khác</option>
          </select></div>
        <div class="col-6 col-lg-2"><label for="price-filter" class="form-label">Giá tối đa</label><select
            id="price-filter" class="form-select">
            <option value="100000">Tất cả</option>
            <option value="30000">30.000đ</option>
            <option value="40000">40.000đ</option>
            <option value="50000">50.000đ</option>
          </select></div>
        <div class="col-6 col-lg-2"><button id="reset-filters" class="btn btn-light border w-100">Đặt lại lọc</button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center my-4">
        <h2 class="section-heading mb-0">Kết quả tìm kiếm</h2><span class="text-secondary small"
          id="result-count"></span>
      </div>
      <div id="product-list" class="row g-3"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/recommendations.js"></script>
</body>

</html>

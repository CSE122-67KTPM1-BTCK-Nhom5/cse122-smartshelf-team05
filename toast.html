<!-- Vùng hiển thị thông báo nổi. JavaScript sẽ thay nội dung và gọi Bootstrap Toast. -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"
     aria-live="polite" aria-atomic="true" style="z-index: 1090;">
  <div id="app-toast" class="toast border-0" role="status">
    <div class="d-flex">
      <div class="toast-body" id="app-toast-message">Thông báo</div>
      <button type="button" class="btn-close me-2 m-auto"
              data-bs-dismiss="toast" aria-label="Đóng"></button>
    </div>
  </div>
</div>
